<title>Borrador</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;
    background:#050a14;color:#e6ecf7;padding:24px;
    font:16px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .caja{width:100%;max-width:22rem;text-align:center}
  .cerrojo{width:64px;height:64px;margin:0 auto 26px;position:relative}
  .cerrojo i{position:absolute;display:block;background:#8fa2c8}
  .cerrojo .arco{left:18px;top:0;width:28px;height:24px;border:6px solid #8fa2c8;
    border-bottom:0;border-radius:14px 14px 0 0;background:none}
  .cerrojo .cuerpo{left:8px;top:22px;width:48px;height:42px;border-radius:6px;background:#c9d3e8}
  h1{font-size:15px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;
    color:#8fa2c8;margin:0 0 8px}
  p{color:#8fa2c8;font-size:14px;margin:0 0 26px}
  input{width:100%;padding:13px 15px;border-radius:9px;border:1px solid #24304a;
    background:#0d1526;color:#e6ecf7;font-size:16px;text-align:center;
    font-family:inherit;letter-spacing:.04em}
  input:focus{outline:2px solid #3987e5;outline-offset:1px;border-color:transparent}
  button{width:100%;margin-top:11px;padding:13px;border:0;border-radius:9px;
    background:#2a78d6;color:#fff;font-size:15px;font-weight:600;cursor:pointer;
    font-family:inherit}
  button:hover{background:#3987e5}
  button[disabled]{opacity:.55;cursor:progress}
  .aviso{min-height:1.5em;margin:14px 0 0;font-size:13.5px;color:#e4796b}
  .nota{margin:30px 0 0;font-size:12px;color:#59657f;line-height:1.5}
</style>

<body>
<main class="caja">
  <div class="cerrojo" aria-hidden="true"><i class="arco"></i><i class="cuerpo"></i></div>
  <h1>Borrador de trabajo</h1>
  <p>No publicar ni reenviar.</p>
  <form id="f">
    <input id="c" type="password" placeholder="Clave" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Clave">
    <button id="b" type="submit">Abrir</button>
  </form>
  <p class="aviso" id="e" role="status"></p>
  <p class="nota">Esto no es control de acceso: es una cortina.
  La clave sirve para no dejar el borrador a la vista, no para protegerlo de
  quien lo busque.</p>
</main>
